spring:
  config:
    activate:
      on-profile: prod

  # ===========================================================
  # Oracle Database — supports both:
  #   1. Oracle Cloud Autonomous DB (wallet TCPS connection)
  #      DB_URL=jdbc:oracle:thin:@(description=(address=(protocol=tcps)(host=...)(port=1522))(connect_data=(service_name=...)))
  #   2. Standard Oracle XE / TCP connection
  #      DB_URL=jdbc:oracle:thin:@//host:1521/XE
  # ===========================================================
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
      connection-test-query: SELECT 1 FROM DUAL
      pool-name: EnterpriseHikariPool

  jpa:
    database-platform: com.dinesh.enterprise.config.CustomOracleDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false

# Railway dynamically injects $PORT — Spring picks it up here
server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    root: WARN
    com.dinesh.enterprise: INFO
    org.hibernate.SQL: OFF
