spring:
  config:
    activate:
      on-profile: prod

  # ===========================================================
  # MySQL Database Connection
  # ===========================================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
      pool-name: EnterpriseHikariPool

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

# Railway dynamically injects $PORT — Spring picks it up here
server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    root: WARN
    com.dinesh.enterprise: INFO
    org.hibernate.SQL: OFF
